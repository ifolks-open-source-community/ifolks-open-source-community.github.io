<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iFolks Open Source Community</title>
  <meta http-equiv="refresh" content="0; url=https://ifolks-org.atlassian.net/wiki/spaces/IFOLKSOSC/overview">
  <link rel="canonical" href="https://ifolks-org.atlassian.net/wiki/spaces/IFOLKSOSC/overview">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    img {
      width: 180px;
      height: auto;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px 0;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    a.btn {
      display: inline-block;
      background-color: #2563eb;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    a.btn:hover {
      background-color: #1d4ed8;
    }
  </style>
  <script>
    window.location.replace("https://ifolks-org.atlassian.net/wiki/spaces/IFOLKSOSC/overview");
  </script>
</head>
<body>
  <div class="card">
    <img src="assets/ifolks-osc-logo.jpg" alt="iFolks Open Source Community Logo">
    <h1>iFolks Open Source Community</h1>
    <p>Redirecting to official community documentation portal...</p>
    <a class="btn" href="https://ifolks-org.atlassian.net/wiki/spaces/IFOLKSOSC/overview">Click here if not redirected</a>
  </div>
</body>
</html>
